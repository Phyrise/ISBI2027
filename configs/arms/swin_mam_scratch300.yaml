# Table 2: SwinUNETR L1 + AFP_seg, from scratch, Adam recipe
# SwinUNETR with the scratch-expert AFP teacher.
extends: ../common.yaml
run_name: swin_mam_scratch300
trainer: adam_gan
epochs: 250
optimizer:
  _replace: true
  name: adam
  betas: [0.9, 0.999]
  weight_decay: 0.0
  clip: 12.0
  grad_scaler_init: 4096.0
schedule:
  _replace: true
  name: constant_then_linear   # per update: 1e-3 for 167 epochs, then linear to 0 at epoch 250
  lr: 1.0e-3
  constant_epochs: 167
  horizon: 250
train:
  snapshots: [0, 1, 10, 25, 50, 100, 150, 200, 250]
precision:
  generator_autocast: bfloat16
  train_autocast: float16      # loss, teacher
  inference_autocast: bfloat16
architecture:
  name: swinunetr
  feature_size: 24
  use_checkpoint: true
init:
  seed: 20261018
  file: ${ISBI_INITS}/generator_init_swin_r11.pth
  nnf_encoder: false
teacher:
  kind: expert               # frozen lesion expert trained from scratch (configs/experts/scratch.yaml), encoder only
  checkpoint: ${ISBI_RUNS}/expert_scratch_c300/checkpoint_ep300.pth
  reference_sha256: b1752b0acc93f8c14403ee2d1292db09936b13fa068c3c399b3dcfbe10fb12af
  features: encoder
  dtype: float16
loss:
  lambda: 0.15225642207042075
  dose_file: configs/doses/swin_mam_scratch300.json
  dose_note: own dose at the Swin init, bf16 generator forward
calibration:
  generator_autocast: bfloat16
paper:
  checkpoint_epoch: 250
  label: "SwinUNETR: L1 + AFP_seg, scratch, Adam"
